name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: Upload a signed build to TestFlight
        required: true
        default: false
        type: boolean

jobs:
  build-ios-ipa:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Check Flutter code
        run: flutter analyze lib test integration_test

      - name: Run unit and widget tests
        run: flutter test test --reporter expanded

      - name: Validate bundled recitations catalog
        run: node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('assets/data/recitations_fallback.json','utf8'));if(!Array.isArray(c.surahs)||c.surahs.length!==114)throw new Error('Expected 114 surahs');const n=c.surahs.map(x=>x.number).sort((a,b)=>a-b);if(n.some((x,i)=>x!==i+1))throw new Error('Invalid surah numbering');console.log('Validated '+c.surahs.length+' surahs');"

      - name: Validate local audio files
        run: node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('assets/data/recitations_fallback.json','utf8'));const bundled=[...c.surahs,...(c.special_recitations||[])].filter(x=>x.bundled);const bundledSurahs=c.surahs.filter(x=>x.bundled);if(bundledSurahs.length!==5)throw new Error('Expected exactly five bundled surahs');for(const s of bundled){if(!fs.existsSync(s.audio_path))throw new Error('Missing-audio '+s.audio_path)}console.log('Validated '+bundled.length+' bundled audio items');"

      - name: Create iOS project and set local-audio mode
        run: |
          rm -rf ios
          flutter create --platforms=ios --org com.faresaltaifi --project-name muathalsuraihi .
          cp tooling/ios/AppDelegate.swift ios/Runner/AppDelegate.swift
          rm -rf ios/Runner/Assets.xcassets/AppIcon.appiconset
          cp -R tooling/ios/AppIcon.appiconset ios/Runner/Assets.xcassets/AppIcon.appiconset
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName تلاوات معاذ السريحي" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes: string audio" ios/Runner/Info.plist || true
          LOCATION_USAGE="$(printf '%s' '2LPZhtiz2KrYrtiv2YUg2YXZiNmC2LnZgyDYo9ir2YbYp9ihINin2LPYqtiu2K/Yp9mFINin2YTYqti32KjZitmCINmE2K3Ys9in2Kgg2YXZiNin2YLZitiqINin2YTYtdmE2KfYqSDZgdmKINmF2K/ZitmG2KrZgy4=' | base64 -D)"
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string $LOCATION_USAGE" ios/Runner/Info.plist || /usr/libexec/PlistBuddy -c "Set :NSLocationWhenInUseUsageDescription $LOCATION_USAGE" ios/Runner/Info.plist

      - name: Apply localized iOS display text
        run: |
          DISPLAY_NAME="$(printf '%s' '2KrZhNin2YjYp9iqINin2YTZgtin2LHYpiDZhdi52KfYsCDYp9mE2LPYsdmK2K3Zig==' | base64 -D)"
          LOCATION_USAGE="$(printf '%s' '2YbYs9iq2K7Yr9mFINmF2YjZgti52YMg2KPYq9mG2KfYoSDYp9iz2KrYrtiv2KfZhSDYp9mE2KrYt9io2YrZgiDZhNit2LPYp9ioINmF2YjYp9mC2YrYqiDYp9mE2LXZhNin2Kkg2YHZiiDZhdiv2YrZhtiq2YMu' | base64 -D)"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName $DISPLAY_NAME" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :NSLocationWhenInUseUsageDescription $LOCATION_USAGE" ios/Runner/Info.plist

      - name: Bundle prayer notification sounds in every iOS build
        run: |
          ruby <<'RUBY'
          require 'xcodeproj'

          project = Xcodeproj::Project.open('ios/Runner.xcodeproj')
          target = project.targets.find { |item| item.name == 'Runner' }
          raise 'Runner target not found' unless target

          phase = target.shell_script_build_phases.find do |item|
            item.name == 'Copy prayer notification sounds'
          end
          phase ||= target.new_shell_script_build_phase('Copy prayer notification sounds')
          phase.shell_script = <<~'SCRIPT'
            set -e
            SOURCE_DIR="$PROJECT_DIR/../assets/audio"
            DESTINATION_DIR="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
            cp "$SOURCE_DIR/adhan_notification.caf" "$DESTINATION_DIR/adhan_notification.caf"
            cp "$SOURCE_DIR/iqama_notification.caf" "$DESTINATION_DIR/iqama_notification.caf"
          SCRIPT
          project.save
          RUBY

      - name: Run iOS integration test
        run: |
          SIMULATOR_ID="$(xcrun simctl list devices available -j | python3 -c "import json,sys; devices=json.load(sys.stdin)['devices']; print(next(device['udid'] for runtime in devices.values() for device in runtime if device['isAvailable'] and device['name'].startswith('iPhone')))" )"
          xcrun simctl boot "$SIMULATOR_ID" || true
          open -a Simulator
          flutter test integration_test -d "$SIMULATOR_ID" --reporter expanded

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign --build-number "$GITHUB_RUN_NUMBER"

      - name: Add prayer notification sounds to iOS bundle
        run: |
          cp assets/audio/adhan_notification.caf build/ios/iphoneos/Runner.app/adhan_notification.caf
          cp assets/audio/iqama_notification.caf build/ios/iphoneos/Runner.app/iqama_notification.caf
          test -s build/ios/iphoneos/Runner.app/adhan_notification.caf
          test -s build/ios/iphoneos/Runner.app/iqama_notification.caf

      - name: Package IPA for AltStore or Sideloadly
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r MuathAlsuraihi-unsigned.ipa Payload

      - name: Verify IPA package
        run: |
          test -s build/ios/iphoneos/Runner.app/Runner
          test -s build/ios/iphoneos/Runner.app/adhan_notification.caf
          test -s build/ios/iphoneos/Runner.app/iqama_notification.caf
          plutil -lint build/ios/iphoneos/Runner.app/Info.plist
          xcrun lipo build/ios/iphoneos/Runner.app/Runner -verify_arch arm64
          unzip -tq build/ios/ipa/MuathAlsuraihi-unsigned.ipa
          shasum -a 256 build/ios/ipa/MuathAlsuraihi-unsigned.ipa

      - name: Prepare App Store Connect signing key
        if: github.event_name == 'workflow_dispatch' && inputs.upload_testflight == true
        env:
          API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
        run: |
          test -n "$API_PRIVATE_KEY"
          printf '%s' "$API_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      - name: Configure Runner distribution signing
        if: github.event_name == 'workflow_dispatch' && inputs.upload_testflight == true
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ruby <<'RUBY'
          require 'xcodeproj'
          project = Xcodeproj::Project.open('ios/Runner.xcodeproj')
          target = project.targets.find { |item| item.name == 'Runner' }
          raise 'Runner target not found' unless target
          configuration = target.build_configurations.find { |item| item.name == 'Release' }
          raise 'Runner Release configuration not found' unless configuration
          configuration.build_settings['DEVELOPMENT_TEAM'] = ENV.fetch('APPLE_TEAM_ID')
          configuration.build_settings['CODE_SIGN_STYLE'] = 'Automatic'
          configuration.build_settings['CODE_SIGN_IDENTITY'] = 'Apple Distribution'
          project.save
          RUBY

      - name: Archive signed TestFlight build
        if: github.event_name == 'workflow_dispatch' && inputs.upload_testflight == true
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          test -n "$APPLE_TEAM_ID"
          test -n "$API_KEY_ID"
          test -n "$API_ISSUER_ID"
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/MuathAlsuraihi.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER_ID" \
            archive

      - name: Export TestFlight IPA
        if: github.event_name == 'workflow_dispatch' && inputs.upload_testflight == true
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key><string>export</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/MuathAlsuraihi.xcarchive" \
            -exportPath build/ios/testflight \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER_ID"
          TESTFLIGHT_IPA="$(find build/ios/testflight -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          test -n "$TESTFLIGHT_IPA"
          test -s "$TESTFLIGHT_IPA"
          echo "TESTFLIGHT_IPA=$TESTFLIGHT_IPA" >> "$GITHUB_ENV"

      - name: Upload signed build to TestFlight
        if: github.event_name == 'workflow_dispatch' && inputs.upload_testflight == true
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          cp "$RUNNER_TEMP/AuthKey.p8" ~/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8
          xcrun altool --upload-app --type ios \
            --file "$TESTFLIGHT_IPA" \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MuathAlsuraihi-unsigned-ipa
          path: build/ios/ipa/MuathAlsuraihi-unsigned.ipa
          if-no-files-found: error
