name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios-ipa:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Check Flutter code
        run: flutter analyze lib

      - name: Validate bundled recitations catalog
        run: node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('assets/data/recitations_fallback.json','utf8'));if(!Array.isArray(c.surahs)||c.surahs.length!==114)throw new Error('Expected 114 surahs');const n=c.surahs.map(x=>x.number).sort((a,b)=>a-b);if(n.some((x,i)=>x!==i+1))throw new Error('Invalid surah numbering');console.log('Validated '+c.surahs.length+' surahs');"

      - name: Validate local audio files
        run: node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('assets/data/recitations_fallback.json','utf8'));for(const s of c.surahs.filter(x=>x.available)){if(!fs.existsSync(s.audio_path))throw new Error('Missing audio: '+s.audio_path)}console.log('Validated local audio files');"

      - name: Create iOS project and set local-audio mode
        run: |
          rm -rf ios
          flutter create --platforms=ios --org com.faresaltaifi --project-name muathalsuraihi .
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Muath Alsuraihi" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes: string audio" ios/Runner/Info.plist || true

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign

      - name: Package IPA for AltStore or Sideloadly
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r MuathAlsuraihi-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MuathAlsuraihi-unsigned-ipa
          path: build/ios/ipa/MuathAlsuraihi-unsigned.ipa
          if-no-files-found: error
