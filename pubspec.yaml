name: muath_alsuraihi
description: "تلاوات القارئ معاذ بن ماجد السريحي - المصحف المرتل (رمضان 1446هـ)"
publish_to: "none"

version: 1.1.1+3

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  just_audio: ^0.9.40
  audio_service: ^0.18.15
  audio_session: ^0.1.21
  shared_preferences: ^2.3.2
  http: ^1.2.2
  path_provider: ^2.1.4
  connectivity_plus: ^6.1.0
  crypto: ^3.0.3
  share_plus: ^10.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/audio/
  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
